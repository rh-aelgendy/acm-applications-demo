apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    demo.acm.example.com/id: aro-retail
  namespace: acm-demo-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        demo.acm.example.com/team: payments
        demo.acm.example.com/id: aro-retail
    spec:
      serviceAccountName: payments-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: registry.access.redhat.com/ubi9/python-312@sha256:d350329565030871c36d24c43533db869e892390fb47dc5c44512a32792dc623
        command:
        - python3
        - -c
        - "from http.server import BaseHTTPRequestHandler, HTTPServer\nimport json,\
          \ os\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n  \
          \      body=json.dumps({\"service\":\"Payments sandbox\", \"team\":\"payments\"\
          , \"status\":\"ready\",\n            \"data\":\"synthetic only; no payment\
          \ processing\", \"identity\":\"configuration contract only; no Azure call\"\
          }).encode()\n        self.send_response(200); self.send_header(\"Content-Type\"\
          ,\"application/json\")\n        self.send_header(\"Content-Length\",str(len(body)));\
          \ self.end_headers(); self.wfile.write(body)\nHTTPServer((\"0.0.0.0\",8080),Handler).serve_forever()\n"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    demo.acm.example.com/id: aro-retail
  namespace: acm-demo-payments
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
