metadata:
  name: orders-bootstrap
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orders-bootstrap
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
rules:
- apiGroups:
  - ''
  resources:
  - secrets
