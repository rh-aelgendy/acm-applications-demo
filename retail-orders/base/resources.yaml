  name: orders-db
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  clusterIP: None
  selector:
    app: orders-db
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-data
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: retail-orders
        app: orders-db
    spec:
      serviceAccountName: orders-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: quay.io/sclorg/postgresql-16-c9s@sha256:b508e74304788fb4a5a2af76d8d013f20a18ee38bff3d24a705d7b730b8c0a30
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: password
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: database
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: orders-data
          mountPath: /var/lib/pgsql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - orders
            - -d
            - orders
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - orders
            - -d
            - orders
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: orders-data
        persistentVolumeClaim:
          claimName: orders-data
---
