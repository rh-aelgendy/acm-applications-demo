  - get
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orders-bootstrap
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orders-bootstrap
subjects:
- kind: ServiceAccount
  name: orders-bootstrap
  namespace: retail-orders-demo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-credentials
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: retail-orders
        app: orders-bootstrap
    spec:
      serviceAccountName: orders-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: generate
        image: registry.access.redhat.com/ubi9/python-312@sha256:d350329565030871c36d24c43533db869e892390fb47dc5c44512a32792dc623
        command:
        - python3
        - /app/credentials.py
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: code
        configMap:
          name: orders-bootstrap-code
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/part-of: retail-orders
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: retail-orders
        app: orders-api
    spec:
      serviceAccountName: orders-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orders-api
        image: registry.access.redhat.com/ubi9/python-312@sha256:d350329565030871c36d24c43533db869e892390fb47dc5c44512a32792dc623
        command:
        - python3
        - /app/api.py
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile: &id002
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONPATH
          value: /deps
        - name: DB_HOST
          value: orders-db
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: database
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: deps
          mountPath: /deps
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: orders-api-code
      - name: tmp
        emptyDir: {}
      - name: deps
        emptyDir: {}
      initContainers:
      - name: python-dependencies
        image: registry.access.redhat.com/ubi9/python-312@sha256:d350329565030871c36d24c43533db869e892390fb47dc5c44512a32792dc623
        command:
        - python3
        - -m
        - pip
        - install
        - --disable-pip-version-check
        - --no-cache-dir
        - '--only-binary=:all:'
        - --require-hashes
        - --target=/deps
        - -r
        - /app/requirements.txt
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
          runAsNonRoot: true
          seccompProfile: *id002
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: deps
          mountPath: /deps
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/part-of: retail-orders
