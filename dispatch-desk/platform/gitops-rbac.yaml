apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatch-gitops
  namespace: acm-demo-dispatch
  labels:
    app.kubernetes.io/part-of: dispatch-desk
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  - routes/custom-host
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatch-gitops
  namespace: acm-demo-dispatch
  labels:
    app.kubernetes.io/part-of: dispatch-desk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatch-gitops
subjects:
- kind: ServiceAccount
  namespace: open-cluster-management-agent-addon
  name: acm-demo-gitops
- kind: ServiceAccount
  namespace: openshift-gitops
  name: openshift-gitops-argocd-application-controller
